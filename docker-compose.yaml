services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_orders}
      POSTGRES_USER: ${POSTGRES_USER:-telegram_orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: ${TZ:-Asia/Tehran}
      PGTZ: ${TZ:-Asia/Tehran}
    volumes:
      # Named volume => orders survive every redeploy and container rebuild.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telegram_orders} -d ${POSTGRES_DB:-telegram_orders}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN must be set}
      SUPERADMIN_IDS: ${SUPERADMIN_IDS:?SUPERADMIN_IDS must be set}
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-telegram_orders}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telegram_orders}
      POSTGRES_DB: ${POSTGRES_DB:-telegram_orders}
      POSTGRES_USER: ${POSTGRES_USER:-telegram_orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TZ: ${TZ:-Asia/Tehran}
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: ${HEALTH_PORT:-8080}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      TELEGRAM_MAX_RETRIES: ${TELEGRAM_MAX_RETRIES:-3}
      ADMIN_NOTIFICATION_COOLDOWN: ${ADMIN_NOTIFICATION_COOLDOWN:-300}
    expose:
      - "8080"
    # Give the bot time to finish an in-flight dispatch before SIGKILL.
    stop_grace_period: 30s

volumes:
  postgres_data:
    driver: local
