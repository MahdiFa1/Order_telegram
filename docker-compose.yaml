# BOT_TOKEN, SUPERADMIN_IDS and POSTGRES_PASSWORD are required at RUN time,
# but are intentionally interpolated without the `:?` guard: platforms such as
# Coolify parse this file before their environment variables are saved, and the
# guard would fail that parse. The bot refuses to start with an empty
# BOT_TOKEN, warns loudly with an empty SUPERADMIN_IDS, and the postgres image
# refuses to initialise without a password -- so nothing starts misconfigured.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_orders}
      POSTGRES_USER: ${POSTGRES_USER:-telegram_orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Tehran}
      PGTZ: ${TZ:-Asia/Tehran}
    volumes:
      # Named volume => orders survive every redeploy and container rebuild.
      - postgres_data:/var/lib/postgresql/data
    networks:
      default:
        # DATABASE_URL dials the host "postgres". Compose derives that name
        # from the service key, but platforms that rewrite service or
        # container names (Coolify appends a resource id) break it, and the
        # bot then fails DNS with "Name or service not known". An explicit
        # alias pins the name regardless of any renaming.
        aliases:
          - postgres
    healthcheck:
      # Block sequence, not a flow sequence on the following line: the Go
      # parser in `docker compose` accepts both, but stricter YAML parsers
      # (including the PHP one Coolify reads this file with) reject the latter.
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-telegram_orders} -d ${POSTGRES_DB:-telegram_orders}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      SUPERADMIN_IDS: ${SUPERADMIN_IDS}
      # DATABASE_URL is deliberately NOT set here. Interpolating the password
      # into a connection string breaks whenever it contains '@', '/', '?' or
      # '#'. The application builds the DSN from the POSTGRES_* parts below and
      # escapes each one, so any password works.
      POSTGRES_DB: ${POSTGRES_DB:-telegram_orders}
      POSTGRES_USER: ${POSTGRES_USER:-telegram_orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TZ: ${TZ:-Asia/Tehran}
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: ${HEALTH_PORT:-8080}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      TELEGRAM_MAX_RETRIES: ${TELEGRAM_MAX_RETRIES:-3}
      ADMIN_NOTIFICATION_COOLDOWN: ${ADMIN_NOTIFICATION_COOLDOWN:-300}
    networks:
      - default
    expose:
      - "8080"
    # Give the bot time to finish an in-flight dispatch before SIGKILL.
    stop_grace_period: 30s

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
    driver: local
